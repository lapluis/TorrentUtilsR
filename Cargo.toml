[package]
name = "TorrentUtilsR"
version = "0.2.11"
edition = "2024"

[lib]
name = "torrent_utils"
path = "src/lib.rs"

[[bin]]
name = "TorrentUtilsR"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:argh", "dep:indicatif", "dep:serde", "dep:toml"]

[dependencies]
argh = { version = "0.1.13", optional = true }
chrono = "0.4.41"
hex = "0.4.3"
indicatif = { version = "0.18.0", optional = true }
natord = "1.0.9"
rayon = "1.11.0"
serde = { version = "1.0.219", features = ["derive"], optional = true }
sha1 = "0.11.0"
toml = { version = "1.0.6", optional = true }
walkdir = "2.5.0"
